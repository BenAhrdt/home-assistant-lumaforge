[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = []

[tool.mypy]
python_version = "3.13"
strict = true
