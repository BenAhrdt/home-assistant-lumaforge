name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check .
      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest >pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          if [[ $status -ne 0 ]]; then
            tail -n 40 pytest-output.txt | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=Pytest failure::$line"
            done
          fi
          exit "$status"
