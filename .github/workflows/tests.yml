name: Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements_test.txt
      - run: ruff check .
      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest >pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          if [[ $status -ne 0 ]]; then
            python - <<'PY'
          from pathlib import Path

          output = Path("pytest-output.txt").read_text(errors="replace")[-50000:]
          escaped = output.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Pytest failure::{escaped}")
          PY
          fi
          exit "$status"
