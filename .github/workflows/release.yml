name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Verify tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/lumaforge/manifest.json").read_text()
          )
          expected_tag = f"v{manifest['version']}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Tag {actual_tag!r} does not match manifest version "
                  f"{manifest['version']!r}; expected {expected_tag!r}"
              )
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --title "LumaForge ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
